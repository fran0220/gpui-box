<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0" />
        <title>GPUI Web: hello_web</title>
        <link data-trunk rel="rust" data-bin="hello_web" data-bindgen-target="web" data-keep-debug data-wasm-opt="0" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                touch-action: none;
                outline: none;
                -webkit-user-select: none;
                user-select: none;
            }
        </style>
    </head>
    <body>
        <script>
            const smokeParameters = new URLSearchParams(location.search);
            if (smokeParameters.get("smoke") === "1") {
                const nextFrame = () => new Promise(requestAnimationFrame);
                const waitFor = async (predicate, timeout = 8000) => {
                    const deadline = performance.now() + timeout;
                    while (!predicate()) {
                        if (performance.now() >= deadline) throw new Error("timed out");
                        await nextFrame();
                    }
                };

                addEventListener("TrunkApplicationStarted", async () => {
                    try {
                        await waitFor(() => document.body.dataset.gpuiSmoke === "ready");
                        await nextFrame();
                        await nextFrame();

                        const canvas = document.querySelector("canvas");
                        if (!canvas?.isConnected) throw new Error("GPUI canvas is not connected");
                        const testAccessibility = smokeParameters.get("a11y") === "1";
                        const canvasBounds = canvas.getBoundingClientRect();
                        let accessibilityButton;
                        if (testAccessibility) {
                            await waitFor(() =>
                                document.querySelector('button[aria-label="GPUI browser smoke target"]'),
                            );
                            accessibilityButton = document.querySelector(
                                'button[aria-label="GPUI browser smoke target"]',
                            );
                            const accessibilityBounds = accessibilityButton.getBoundingClientRect();
                            const boundsMatch = ["left", "top", "width", "height"].every(
                                (edge) => Math.abs(canvasBounds[edge] - accessibilityBounds[edge]) <= 1,
                            );
                            if (!boundsMatch) throw new Error("accessibility bounds do not match the canvas");
                            const gpuiInput = document.querySelector("body > input");
                            if (document.activeElement !== gpuiInput) {
                                throw new Error("passive accessibility synchronization stole GPUI input focus");
                            }
                            accessibilityButton.focus();
                            await waitFor(() => document.activeElement === accessibilityButton);
                            document.body.dataset.gpuiA11y = "pass";
                        }
                        document.body.dataset.gpuiSmokePhase = "click";

                        const eventInit = {
                            bubbles: true,
                            button: 0,
                            buttons: 1,
                            clientX: canvasBounds.left + canvasBounds.width / 2,
                            clientY: canvasBounds.top + canvasBounds.height / 2,
                            pointerId: 1,
                            pointerType: "mouse",
                        };
                        canvas.dispatchEvent(new PointerEvent("pointerdown", eventInit));
                        canvas.dispatchEvent(new PointerEvent("pointerup", { ...eventInit, buttons: 0 }));
                        await waitFor(() => document.body.dataset.gpuiSmokeClicks === "1");
                        if (!canvas.isConnected) throw new Error("GPUI canvas was removed after launch");

                        document.body.dataset.gpuiPainted = "true";
                        document.body.dataset.gpuiRenderer = canvas.dataset.gpuiRenderer ?? "unknown";
                        document.body.dataset.gpuiIsolated = String(crossOriginIsolated);
                        document.body.dataset.gpuiSmokeResult = "pass";
                    } catch (error) {
                        document.body.dataset.gpuiSmokeError = String(error);
                        document.body.dataset.gpuiSmokeResult = "fail";
                    }
                });
            }
        </script>
    </body>
</html>
