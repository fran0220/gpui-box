[package]
name = "gpui-box-webview"
description = "Caller-owned native browser engine hosts for GPUI Box"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "gpui_webview"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
raw-window-handle.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
wry = "=0.57.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"
gdkx11 = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
windows-native = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true
objc2 = "0.6.4"

[dev-dependencies]
gpui_platform = { package = "gpui-box-platform", path = "../gpui_platform" }
serde_json.workspace = true

[lints]
workspace = true
