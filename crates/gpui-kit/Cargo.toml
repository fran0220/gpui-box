[package]
name = "gpui-box-kit"
description = "GPUI Box Kit design-system components and interaction primitives"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "gpui_kit"

[features]
default = ["native-media", "terminal"]
# The reference calendar the datetime scenes and tests run on. Off by default,
# so a host cannot reach a fixture calendar from the component path.
fixtures = []
# Native playback remains the normal component contract. Deterministic visual
# harnesses can disable it while retaining the same player and transport types.
native-media = ["media/native-playback"]
# Deterministic, pure-Rust `.lottie` decoding and raster sampling. The public
# effects contracts and particle/poster fallbacks remain available without it.
dotlottie = ["dep:base64", "dep:image", "dep:rasterlottie", "dep:zip"]
# The terminal grid, and the `alacritty_terminal` escape-sequence state machine
# under it. On by default so the gate, the gallery and the visual baselines all
# cover it; a host that wants none of it turns default features off. The
# dependency parses bytes and holds grid state — it opens no pty and spawns no
# process, which stays the host's job.
terminal = ["dep:alacritty_terminal"]

[dependencies]
unicode-segmentation.workspace = true
alacritty_terminal = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
gpui.workspace = true
gpui-kit-assets.workspace = true
gpui-kit-semantics.workspace = true
gpui-kit-theme.workspace = true
gpui-kit-tokens.workspace = true
image = { workspace = true, optional = true }
media = { workspace = true, default-features = false }
pulldown-cmark.workspace = true
rasterlottie = { workspace = true, optional = true }
# Parsing only, for the bounded glTF reader in `media::gltf`. Nothing here
# serializes, and nothing here resolves a URI.
serde = { workspace = true }
serde_json.workspace = true
web-time.workspace = true
zip = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation"] }

[dev-dependencies]
gpui = { package = "gpui-box", path = "../gpui", features = ["test-support"] }
# The tests drive the datetime scenes, which only exist with the reference
# calendar compiled in.
gpui-kit = { package = "gpui-box-kit", path = ".", features = ["fixtures"] }
gpui-kit-testkit = { package = "gpui-box-kit-testkit", path = "../gpui-kit-testkit", features = ["test-support"] }

[lints]
workspace = true
