version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
publish = true
license = "Apache-2.0"
description = "A sum tree data structure, a concurrency-friendly B-tree"

repository = "https://github.com/fran0220/gpui-box"
[lints]
workspace = true

[lib]
