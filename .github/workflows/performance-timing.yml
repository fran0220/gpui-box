name: Performance timing

# Observational Criterion lane on a hosted runner, dispatched when a renderer
# timing trend is wanted. It is not a gate and runs on no push.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_BENCH_DEBUG: "0"

concurrency:
  group: performance-timing
  cancel-in-progress: false

jobs:
  criterion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
      - name: Run renderer Criterion benchmarks
        run: cargo bench -p gpui-box-wgpu --bench layout_line --locked
      - name: State the acceptance gap explicitly
        run: |
          echo 'Timing acceptance is NOT implemented: these are observational Criterion artifacts, not a calibrated regression verdict. See docs/performance-testing.md for baseline, calibration, noise-envelope and comparator requirements.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
