name: Performance timing
on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 * * 1"

permissions:
  contents: read

env:
  CARGO_PROFILE_BENCH_DEBUG: "0"

concurrency:
  group: performance-timing
  cancel-in-progress: false

jobs:
  criterion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
      - name: Run renderer Criterion benchmarks
        run: cargo bench -p gpui-box-wgpu --bench layout_line --locked
      - uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
