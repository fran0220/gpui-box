name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: scripts/sync-zed/sync-zed verify --release
      - run: python3 -m unittest discover -s scripts/sync-zed/tests -v
      - run: cargo run -p xtask -- dependencies check
      - run: cargo run -p xtask -- gate
      - run: cargo doc --no-deps --workspace
        env: { RUSTDOCFLAGS: "-D warnings" }

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@0.2.126" }
      - run: cargo run -p xtask -- web check
      - run: cargo run -p xtask -- web build
      - run: cargo run -p xtask -- web smoke
      - run: cargo run -p xtask -- web visual check button input dialog node-graph

  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- headless check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-diff-${{ runner.os }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-local-registry --version 0.2.12 --locked
      - run: cargo run -p xtask -- package check

  # Real-window capture is intentionally self-hosted: unlike the headless gate,
  # it needs a logged-in composited macOS session, a frontmost window, and the
  # exact display scale used by the legacy real-window baselines.
  visual:
    if: ${{ vars.VISUAL_RUNNER != '' }}
    runs-on: ${{ vars.VISUAL_RUNNER }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.0 }
      - run: cargo run -p xtask -- scenes check
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: scene-check, path: target/scene-check }
