name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -p xtask -- tokens check
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      # Captures render with reduced motion and a parked pointer, so a scene
      # produces the same bytes on every machine. A difference here is a real
      # visual change, not noise.
      - run: cargo run -p xtask -- scenes check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-check
          path: target/scene-check
