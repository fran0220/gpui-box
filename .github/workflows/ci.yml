name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

env:
  # CI never attaches a debugger. Omitting debug information makes the large
  # GPUI dependency graph faster to link and small enough to cache reliably.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Fetch canonical source-provenance refs
        run: git fetch origin refs/heads/vendor/zed-gpui:refs/heads/vendor/zed-gpui refs/heads/vendor/zed-gpui-fork-overlay:refs/heads/vendor/zed-gpui-fork-overlay
      - run: scripts/sync-zed/sync-zed verify
      - run: python3 -m unittest discover -s scripts/sync-zed/tests -v
      - run: python3 -m unittest discover -s scripts/release/tests -v
      - run: cargo run -p xtask -- gate
      - run: cargo doc --no-deps --workspace
        env: { RUSTDOCFLAGS: "-D warnings" }

  native:
    strategy:
      fail-fast: false
      matrix:
        # The authority job is the Linux all-feature native gate.
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Run native media lifecycle tests
        run: cargo test -p gpui-box-media --all-features --locked
      - name: Run the remaining macOS platform tests
        if: runner.os == 'macOS'
        run: cargo test --workspace --all-features --locked --exclude gpui-box-media
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Compile Direct3D release shaders
        if: runner.os == 'Windows'
        run: cargo check -p gpui-box-windows --release --locked

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@0.2.126" }
      - run: cargo run -p xtask -- web gate button input dialog node-graph

  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          # CI enters the visual workspace directly. Building the root xtask
          # first would compile the same GPUI/Kit graph into a second target.
          workspaces: tools/headless-visual -> target
      - run: cargo run --locked --manifest-path tools/headless-visual/Cargo.toml -- check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-diff-${{ runner.os }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows-build:
    name: headless build (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/headless-visual -> target
      - run: cargo build --locked --manifest-path tools/headless-visual/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: headless-windows-executable
          path: tools/headless-visual/target/debug/gpui-box-headless-visual.exe
          if-no-files-found: error

  headless-windows-shard:
    name: headless shard ${{ matrix.shard }} (windows-2025)
    needs: headless-windows-build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: headless-windows-executable
          path: tools/headless-visual/target/debug
      - run: tools/headless-visual/target/debug/gpui-box-headless-visual.exe check --shard ${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-diff-Windows-${{ matrix.shard }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows:
    # Preserve the public required-check name while the expensive rendering is
    # spread over the eight jobs above.
    name: headless (windows-2025)
    if: always()
    needs: [headless-windows-build, headless-windows-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the build and every shard
        if: needs.headless-windows-build.result != 'success' || needs.headless-windows-shard.result != 'success'
        run: exit 1

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          # Older package-check caches retained a transient Cargo home whose
          # extracted sources contain broken test-fixture symlinks. Use a clean
          # namespace now that package check deletes that proof tree on success.
          shared-key: package-clean-v1
      - run: cargo install cargo-local-registry --version 0.2.12 --locked
      - run: cargo run -p xtask -- package check
