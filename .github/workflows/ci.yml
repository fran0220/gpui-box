name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -p xtask -- tokens check
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      # Says out loud that the visual gate did not run here, rather than
      # leaving a skipped job for a reviewer to notice. A gate nobody was told
      # about is the same problem as a gate that passes without looking.
      - name: Report whether the visual regression ran
        if: ${{ vars.VISUAL_RUNNER == '' }}
        run: |
          echo "::notice title=Visual regression did not run::No VISUAL_RUNNER is configured, so \`xtask scenes check\` ran nowhere in CI. A UI change needs the result of a local run pasted into the pull request."
          {
            echo "### Visual regression: not run"
            echo
            echo "\`cargo run -p xtask -- scenes check\` needs a composited, frontmost"
            echo "window and a display matching the one the baselines were captured on."
            echo "No \`VISUAL_RUNNER\` repository variable is set, so no job ran it."
            echo "See docs/screenshot-testing.md for the manual step a reviewer records."
          } >> "$GITHUB_STEP_SUMMARY"

  # The visual regression gate, which only runs where it can actually look.
  #
  # `xtask scenes check` drives a real gallery window and asks the macOS window
  # server for its pixels, so it needs three things a GitHub-hosted runner is
  # not known to provide: a GUI session that composites windows, an application
  # that can make itself frontmost (a window nobody composites hands back the
  # frame it drew last, which is how a capture silently reads the previous
  # scene), and a display whose size and backing scale factor match the machine
  # the committed baselines came from. The baselines are 1842x1374 device
  # pixels; the comparison treats any difference in size as maximally different,
  # so a runner with a 1x virtual display fails all 116 images without a
  # component having changed.
  #
  # None of that has been established on a hosted runner, so this job runs only
  # where an operator has said it can: set the repository variable
  # VISUAL_RUNNER to the labels of a self-hosted macOS runner with a logged-in
  # graphical session. Pointing it at a hosted label is how this gate goes back
  # to reporting things that did not happen.
  visual:
    if: ${{ vars.VISUAL_RUNNER != '' }}
    runs-on: ${{ vars.VISUAL_RUNNER }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      # Captures render with reduced motion and a parked pointer, so a scene
      # produces the same bytes on every run of the same machine. A difference
      # here is a real visual change, not noise.
      - run: cargo run -p xtask -- scenes check
      # The scratch directory holds what the run actually captured, which is
      # the only way a reviewer can see what changed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scene-check
          path: target/scene-check
