name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Authority version without the v prefix
        required: true
        type: string
      execute:
        description: Publish after preflight
        required: true
        default: false
        type: boolean
      auth:
        description: crates.io authentication; token is required for each crate's first publication
        required: true
        default: token
        type: choice
        options: [token, oidc]
      bootstrap_trusted_publishing:
        description: Configure OIDC and enforce trusted-publishing-only after initial publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      release_commit: ${{ steps.tag.outputs.release_commit }}
    steps:
      - name: Require a valid protected-branch operation
        if: ${{ inputs.execute || inputs.bootstrap_trusted_publishing }}
        env:
          EXECUTE: ${{ inputs.execute }}
          BOOTSTRAP_TRUSTPUB: ${{ inputs.bootstrap_trusted_publishing }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$EXECUTE" != "$BOOTSTRAP_TRUSTPUB"
      - uses: actions/checkout@v5
        with: { ref: "v${{ inputs.version }}", fetch-depth: 0 }
      - name: Verify immutable tag and authority version
        id: tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'[0-9A-Za-z][0-9A-Za-z.+-]*', version):
              raise SystemExit(f'invalid release version: {version!r}')
          PY
          test "$(git cat-file -t "refs/tags/v${RELEASE_VERSION}")" = tag
          test "$(git rev-list -n 1 "refs/tags/v${RELEASE_VERSION}")" = "$(git rev-parse HEAD)"
          if test "$RELEASE_VERSION" = 0.1.0; then
            test "$(git rev-parse HEAD)" = 888369c73c258567664785a761faebdc64d39d4e
          fi
          python3 - <<'PY'
          import os
          import tomllib
          with open('package-authority.toml', 'rb') as source:
              packages = tomllib.load(source)['package']
          versions = {package['version'] for package in packages if package['publish']}
          expected = {os.environ['RELEASE_VERSION']}
          if versions != expected:
              raise SystemExit(f'authority versions {versions!r} do not equal {expected!r}')
          PY
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with:
          # Do not restore pre-cleanup package proof trees into release
          # preflight; successful checks retain only authoritative archives.
          shared-key: package-clean-v1
      - name: Fetch canonical source-provenance refs
        run: git fetch origin refs/heads/vendor/zed-gpui:refs/heads/vendor/zed-gpui refs/heads/vendor/zed-gpui-fork-overlay:refs/heads/vendor/zed-gpui-fork-overlay
      - run: cargo install cargo-local-registry --version 0.2.12 --locked
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: scripts/sync-zed/sync-zed verify
      - run: python3 -m unittest discover -s scripts/sync-zed/tests -v
      - run: cargo run -p xtask -- gate
      - run: cargo doc --no-deps --workspace
        env: { RUSTDOCFLAGS: "-D warnings" }
      - run: cargo run -p xtask -- package check
      - name: Generate reproducible CycloneDX 1.5 SBOMs
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" cargo cyclonedx --all --all-features --format json --spec-version 1.5
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-box-${{ inputs.version }}-${{ steps.tag.outputs.release_commit }}-crates
          path: target/package-check/archives/*.crate
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: gpui-box-${{ inputs.version }}-${{ steps.tag.outputs.release_commit }}-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        # Linux is already covered by the preflight authority gate.
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - name: Install Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Run native media lifecycle tests
        run: cargo test -p gpui-box-media --all-features --locked
      - name: Run the remaining native platform tests, including framework tests
        run: cargo test --workspace --all-features --locked --exclude gpui-box-media
      - name: Reject platform-specific warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check deterministic component performance budgets
        run: cargo run -p xtask --locked -- performance check
      - name: Compile Direct3D release shaders
        if: runner.os == 'Windows'
        run: cargo check -p gpui-box-windows --release --locked

  headless:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - name: Install Linux GPUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/headless-visual -> target
      - run: cargo run --locked --manifest-path tools/headless-visual/Cargo.toml -- check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-release-diff-${{ runner.os }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows-build:
    name: headless build (windows-2025)
    needs: preflight
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/headless-visual -> target
      - run: cargo build --locked --manifest-path tools/headless-visual/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: headless-release-windows-executable
          path: tools/headless-visual/target/debug/gpui-box-headless-visual.exe
          if-no-files-found: error

  headless-windows-shard:
    name: headless shard ${{ matrix.shard }} (windows-2025)
    needs: [preflight, headless-windows-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with:
          name: headless-release-windows-executable
          path: tools/headless-visual/target/debug
      - run: tools/headless-visual/target/debug/gpui-box-headless-visual.exe check --shard ${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-release-diff-Windows-${{ matrix.shard }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows:
    name: headless (windows-2025)
    if: always()
    needs: [headless-windows-build, headless-windows-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the build and every shard
        if: needs.headless-windows-build.result != 'success' || needs.headless-windows-shard.result != 'success'
        run: exit 1

  web:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - name: Install browser system tools
        run: sudo apt-get update && sudo apt-get install -y xauth xvfb
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@0.2.127" }
      - run: cargo run -p xtask -- web gate button input dialog node-graph

  semver:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0 }
      - name: Install Linux GPUI libraries
        if: ${{ inputs.version != '0.1.0' && runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - name: Install cargo-semver-checks
        if: ${{ inputs.version != '0.1.0' }}
        uses: taiki-e/install-action@v2
        with: { tool: "cargo-semver-checks@0.50.0" }
      - name: Compare every published library API with crates.io
        if: ${{ inputs.version != '0.1.0' }}
        run: cargo semver-checks check-release --manifest-path Cargo.toml --workspace --all-features

  publish-with-token:
    if: ${{ inputs.execute && inputs.auth == 'token' }}
    needs: [preflight, native, headless, headless-windows, web, semver]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}", fetch-depth: 0, path: publisher }
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0, path: release }
      - name: Verify publisher and immutable release checkouts
        run: |
          test "$(git -C publisher rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C release rev-parse HEAD)" = "${{ needs.preflight.outputs.release_commit }}"
          test -z "$(git -C release status --porcelain)"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: actions/download-artifact@v7
        with:
          name: gpui-box-${{ inputs.version }}-${{ needs.preflight.outputs.release_commit }}-crates
          path: release/target/package-check/archives
      - name: Require protected crates.io token
        run: test -n "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - run: cargo run --manifest-path publisher/xtask/Cargo.toml -- package publish --execute
        env:
          GPUI_BOX_PUBLISH: "1"
          GPUI_BOX_RELEASE_ROOT: ${{ github.workspace }}/release
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish-with-oidc:
    if: ${{ inputs.execute && inputs.auth == 'oidc' }}
    needs: [preflight, native, headless, headless-windows, web, semver]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}", fetch-depth: 0, path: publisher }
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.preflight.outputs.release_commit }}", fetch-depth: 0, path: release }
      - name: Verify publisher and immutable release checkouts
        run: |
          test "$(git -C publisher rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C release rev-parse HEAD)" = "${{ needs.preflight.outputs.release_commit }}"
          test -z "$(git -C release status --porcelain)"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: actions/download-artifact@v7
        with:
          name: gpui-box-${{ inputs.version }}-${{ needs.preflight.outputs.release_commit }}-crates
          path: release/target/package-check/archives
      - id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo run --manifest-path publisher/xtask/Cargo.toml -- package publish --execute
        env:
          GPUI_BOX_PUBLISH: "1"
          GPUI_BOX_RELEASE_ROOT: ${{ github.workspace }}/release
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  bootstrap-trusted-publishing:
    if: ${{ inputs.bootstrap_trusted_publishing }}
    needs: [preflight, native, headless, headless-windows, web, semver]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}", fetch-depth: 0 }
      - name: Test trusted-publishing reconciliation
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Require protected crates.io bootstrap token
        run: test -n "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Configure and verify every trusted publisher
        run: python3 scripts/release/trusted_publishing.py configure
        env:
          GPUI_BOX_TRUSTPUB_BOOTSTRAP: "1"
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - id: crates-io-auth
        name: Verify the release workflow OIDC identity
        uses: rust-lang/crates-io-auth-action@v1
      - name: Require an exchanged short-lived token
        run: test -n "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - name: Enforce trusted-publishing-only for every crate
        run: python3 scripts/release/trusted_publishing.py harden
        env:
          GPUI_BOX_TRUSTPUB_BOOTSTRAP: "1"
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Require out-of-band bootstrap-token revocation
        run: |
          echo "crates.io scoped tokens cannot call either token-revocation endpoint."
          echo "Revoke the bootstrap token in crates.io Account Settings, then delete the CI secret."
