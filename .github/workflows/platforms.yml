name: Platforms

# macOS and Windows evidence, produced only when somebody asks for it.
#
# The daily gate is `cargo run -p xtask -- gate full` on the Linux orb, which
# proves the all-feature native graph, the browser build, and the llvmpipe
# visual baseline without any hosted runner. This workflow covers native OS
# integrations and the two renderers that cannot run there: Metal and WARP. Dispatch it before a
# release, after a renderer or token change, or whenever a macOS or Windows
# claim in `compatibility.toml` needs fresh evidence. Nothing here runs on push.
#
# A failing headless job uploads its changed frames. Accept them into the
# committed baseline with `tools/headless-visual/accept-run.sh <run-id>` after
# looking at every image.

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the macOS native tests and Metal headless catalog
        required: true
        default: true
        type: boolean
      windows:
        description: Run the Windows native tests and WARP headless catalog
        required: true
        default: true
        type: boolean
      scenes:
        description: Space-separated scene names to check (empty means the whole catalog)
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Hosted runners never attach a debugger. Omitting debug information makes
  # the large GPUI dependency graph faster to link and small enough to cache.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-macos:
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "26.5.1" }
      - name: Execute native Seatbelt and runtime supervisor checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/runtime-native
          {
            node --version
            cc -Wall -Wextra -Werror -O2 tools/js-runtime/native/macos-launch.c -o target/runtime-native/gpui-sandbox-launch
            export GPUI_SANDBOX_LAUNCHER="$PWD/target/runtime-native/gpui-sandbox-launch"
            npm --prefix tools/app-host ci
            npm --prefix tools/app-host run check
          } 2>&1 | tee target/runtime-native/check.log
      - name: Collect native macOS sandbox failure evidence
        if: always()
        shell: bash
        run: |
          mkdir -p target/runtime-native/crashes
          /usr/bin/log show --last 20m --style compact --predicate 'process == "sandbox-exec" OR process == "amfid" OR sender == "Sandbox" OR eventMessage CONTAINS[c] "Sandbox:"' > target/runtime-native/sandbox-unified.log 2>&1 || true
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -mmin -20 \( -name 'probe-*.ips' -o -name 'node-*.ips' -o -name 'launcher-*.ips' -o -name 'sandbox-exec-*.ips' -o -name 'gpui-sandbox-launch-*.ips' \) -exec cp {} target/runtime-native/crashes/ \; || true
            fi
          done
          {
            sw_vers
            uname -m
            cc --version
            for file in /System/Library/Sandbox/Profiles/dyld-support.sb /System/Library/Sandbox/Profiles/bsd.sb; do
              if [ -r "$file" ]; then
                printf '\n%s\n' "$file"
                cat "$file"
              fi
            done
          } > target/runtime-native/platform-profile.log 2>&1
      - name: Retain native macOS sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-native-macos
          path: |
            target/runtime-native/*.log
            target/runtime-native/crashes/*.ips
          if-no-files-found: warn

  runtime-windows:
    if: inputs.windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "26.5.1" }
      - name: Execute native AppContainer and runtime supervisor checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/runtime-native | Out-Null
          Start-Transcript -Path target/runtime-native/check.log
          try {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Visual C++ toolchain unavailable' }
            Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
            Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
            & tools/js-runtime/native/build-windows.ps1
            # Keep the launcher/probe environment from the build script in this process.
            node --version
            if ($LASTEXITCODE -ne 0) { throw 'Node version check failed' }
            npm --prefix tools/app-host ci
            if ($LASTEXITCODE -ne 0) { throw 'Runtime dependencies failed' }
            node --test tools/js-runtime/test/windows.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows sandbox checks failed' }
            npm --prefix tools/app-host run check
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows runtime checks failed' }
          } finally {
            Stop-Transcript
          }
      - name: Retain native Windows sandbox diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-native-windows
          path: target/runtime-native/*.log
          if-no-files-found: warn

  native-macos:
    if: inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Run native media lifecycle tests
        run: cargo test -p gpui-box-media --all-features --locked
      - name: Run the remaining macOS platform tests
        run: cargo test --workspace --all-features --locked --exclude gpui-box-media
      - name: Execute native WKWebView browser smoke
        timeout-minutes: 10
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          mkdir -p target/webview-smoke
          {
            sw_vers
            rustc --version
            cargo run --locked -p gpui-box-webview --example smoke
          } 2>&1 | tee target/webview-smoke/smoke.log
      - name: Retain native macOS browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-smoke-macos
          path: target/webview-smoke/
          if-no-files-found: warn
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check deterministic component performance budgets
        run: cargo run -p xtask --locked -- performance check

  native-windows:
    if: inputs.windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Run native media lifecycle tests
        run: cargo test -p gpui-box-media --all-features --locked
      - name: Run the remaining Windows platform tests
        run: cargo test --workspace --all-features --locked --exclude gpui-box-media
      - name: Execute native WebView2 browser smoke
        timeout-minutes: 10
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          mkdir -p target/webview-smoke
          {
            uname -a
            rustc --version
            # WebView2 runtime creation is part of the test. Missing or broken
            # runtime is a failure, not a successful compile-only fallback.
            cargo run --locked -p gpui-box-webview --example smoke
          } 2>&1 | tee target/webview-smoke/smoke.log
      - name: Retain native Windows browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-smoke-windows
          path: target/webview-smoke/
          if-no-files-found: warn
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run native Windows UI Automation smoke
        run: cargo run -p xtask --locked -- accessibility check
      - name: Preserve native Windows UI Automation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-windows-uia
          path: target/accessibility/windows
          if-no-files-found: ignore
      - name: Check deterministic component performance budgets
        run: cargo run -p xtask --locked -- performance check
      - name: Compile Direct3D release shaders
        run: cargo check -p gpui-box-windows --release --locked

  headless-macos:
    if: inputs.macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          # Enter the visual workspace directly. Building the root xtask first
          # would compile the same GPUI/Kit graph into a second target.
          workspaces: tools/headless-visual -> target
      - run: cargo run --locked --manifest-path tools/headless-visual/Cargo.toml -- check ${{ inputs.scenes }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-diff-macOS
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows-build:
    if: inputs.windows
    name: headless build (windows-2025)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/headless-visual -> target
      - run: cargo build --locked --manifest-path tools/headless-visual/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: headless-windows-executable
          path: tools/headless-visual/target/debug/gpui-box-headless-visual.exe
          if-no-files-found: error

  headless-windows-shard:
    if: inputs.windows
    name: headless shard ${{ matrix.shard }} (windows-2025)
    needs: headless-windows-build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: headless-windows-executable
          path: tools/headless-visual/target/debug
      - run: tools/headless-visual/target/debug/gpui-box-headless-visual.exe check --shard ${{ matrix.shard }}/8 ${{ inputs.scenes }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: headless-diff-Windows-${{ matrix.shard }}
          path: target/headless-scene-check
          if-no-files-found: ignore

  headless-windows:
    # One job that answers for the build and every shard, so a person reading
    # the run sees a single Windows visual verdict.
    if: always() && inputs.windows
    name: headless (windows-2025)
    needs: [headless-windows-build, headless-windows-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the build and every shard
        if: needs.headless-windows-build.result != 'success' || needs.headless-windows-shard.result != 'success'
        run: exit 1
