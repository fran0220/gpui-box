name: Deploy site and MCP

# Fallback deployment lane. The ordinary path is `tools/site/deploy-main.sh`
# run from the Linux orb immediately after a push to `main`; nothing deploys
# on push from here. Dispatch this only when no machine with the deployment
# identity is available.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-box-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      GPUI_BOX_DEPLOY_HOST: root@67.230.183.147
      GPUI_BOX_DEPLOY_SSH_KEY: /home/runner/.ssh/gpui-box-production
      GPUI_BOX_DEPLOY_KNOWN_HOSTS: tools/site/ops/bwg-known-hosts
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require the deploy revision to be on origin/main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Install Linux build and headless-renderer libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libegl1-mesa-dev libfontconfig1-dev libudev-dev
          libvulkan-dev libwayland-dev libx11-dev libx11-xcb-dev
          libxcb-randr0-dev libxcb-xfixes0-dev libxcb1-dev
          libxkbcommon-x11-dev mesa-vulkan-drivers musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-bindgen-cli@0.2.127" }
      - name: Install the restricted BWG deployment identity
        env:
          DEPLOY_KEY: ${{ secrets.BWG_GPUI_BOX_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          install -d -m 0700 /home/runner/.ssh
          printf '%s\n' "$DEPLOY_KEY" > "$GPUI_BOX_DEPLOY_SSH_KEY"
          chmod 0600 "$GPUI_BOX_DEPLOY_SSH_KEY"
      - name: Build and deploy the immutable release
        run: tools/site/deploy.sh
      - name: Verify the BWG origin before relying on public DNS
        run: tools/site/verify-deployment.sh
