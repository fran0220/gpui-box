name: iOS native smoke

# Explicit native simulator evidence only; never runs on push and never signs
# or publishes a store release. Device IME/VoiceOver acceptance is separate.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.97.1, components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Check portable host contracts and finite runner cleanup
        run: |
          bash examples/ios-native/check-portable.sh
          python3 -B examples/ios-native/test_runner.py
      - name: Execute native UIKit and direct Metal protocol fixture
        run: python3 -B examples/ios-native/run-simulator.py
      - name: Execute actual GPUI UIKit and WGPU rendering fixture
        if: ${{ !cancelled() }}
        run: python3 -B examples/ios-native/run-simulator.py --gpui
      - name: Execute shared Kit reference application
        if: ${{ !cancelled() }}
        run: python3 -B examples/ios-native/run-simulator.py --reference
      - name: Retain native build, runtime identity, console and pixels
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-evidence
          path: |
            target/ios-native/evidence/
            target/ios-native/gpui-evidence/
            target/ios-native/reference-evidence/
          if-no-files-found: warn
