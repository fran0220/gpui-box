ci_gated = true
gate_lane = "on-demand"
ci_commands = ["cargo test -p gpui-box-media --all-features --locked", "cargo test --workspace --all-features --locked --exclude gpui-box-media", "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings", "cargo run -p xtask -- performance check", "cargo run -p xtask -- headless check"]
limitations = ["evidence comes from a dispatched Platforms run, not from every push", "native context-menu presentation requires a logged-in host", "native playback covers unprotected sources and operating-system codecs only", "does not prove other platforms"]

