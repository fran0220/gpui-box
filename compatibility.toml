[mobile_development]
status = "experimental-source-native-acceptance-pending"
android = "API33+ arm64 Vulkan, one opaque Activity; JNI lifecycle, touch, InputConnection and basic AccessKit bridge. Host-check does not compile Java, link an APK or execute Android."
ios = "UIKit host and WGPU Metal adapter with caller-supplied fonts, affinity-aware text queries and basic AccessKit projection. Linux platform-check is not Xcode linking or UIKit execution."
browser = "Pointer contact identity, lifecycle cancellation, residual VisualViewport/safe-area edges, keyless input and IME traits. Chromium touch and inset fixtures are not Android Chrome or iOS Safari device acceptance."
native_editors = "TextInput and TextArea implement native affinity/selection hooks, including masked and OTP wrappers. RichTextEditor retains its legacy handler; its native affinity/geometry adapter is missing, and Android's native selection bridge refuses it."
host_checks = ["cargo test -p gpui-box-ios -p gpui-box-android --all-features", "cargo check -p gpui-box-ios --features platform-check", "cargo check -p gpui-box-android-example --features host-check", "npm --prefix examples/browser-gallery run mobile"]
native_requirements = ["licensed Android SDK/NDK and authorized device or external emulator", "macOS with Xcode and installed iOS simulator runtime", "actual keyboard/IME, accessibility and surface lifecycle acceptance", "signing and device provisioning for physical iOS devices"]
limitations = ["no complete mobile accessibility claim", "native hardware keyboard/pointer coverage incomplete", "OS autofill, process restoration and predictive back remain capability-scoped", "portable tests and construction markers do not establish presented frames"]

[mobile_reference]
package = "gpui-box-mobile-reference"
contract = "Default library mounts caller-owned fixture state without a desktop platform dependency. Versioned checkpoints exclude focus, keyboard, open overlays and active refresh. Native example hosts choose back policy and private persistence."
capture = "cargo run -p gpui-box-mobile-reference --features capture --example capture -- target/mobile-reference"
ios = "python3 -B examples/ios-native/run-simulator.py --reference"
android = "bash examples/android/launch.sh reference"
limitations = ["offscreen 390px and resized-window captures do not establish native keyboard or touch timing", "native persistence and recreation require executed device/simulator evidence", "Android requires a separately installed development APK and ANDROID_SERIAL"]

[framework_native_operations]
contract = "App::try_* and Window::try_* check support and dispatch synchronously on the owning thread. Unsupported, unavailable and refused requests are distinct; acceptance does not mean the OS transition completed. Mobile defaults deny unless a backend implements the operation. Legacy desktop behavior is preserved."
automatic_pointer = "Draw and hit-test cursor styling check SetCursorStyle; typing and handled-action hiding independently check HideCursorUntilMouseMoves. Refusal skips only the native call, preserving rendering, hit testing and input delivery. Android admits its implemented styling; UIKit currently refuses both."
surface_lifecycle = "WGPU explicit detach/destroy drain submitted native resources before platform handle invalidation. Device loss can make completion unconfirmable; destroy still releases resources and reports failure. Repeated cleanup after release succeeds. Native lifecycle execution remains required."

[framework_context_menu]
contract = "Window::show_context_menu returns an opaque revision session with captured EffectOwner. Cancellation invalidates command authority immediately, but completion waits for native tracking exit. Replacements serialize across windows; stale cancellation cannot end a newer menu. Only NotSupported permits fallback; cancellation refusal and unavailable presentation are distinct from dismissal. macOS uses NSMenu.cancelTracking and Windows uses identity-guarded EndMenu. Linux/browser retain explicit unsupported capability."
tests = ["native_context_menu_revision_and_refusal", "native_context_menu_cross_window_replacement", "native_context_menu_invalidation_waits_for_real_completion", "native_context_menu_transport_loss_is_not_dismissal", "native_context_menu_dispatches_in_the_captured_focus_context"]
native_smoke = "cargo run --locked -p gpui-box-platform --features test-support --example native_menu_smoke"
native_smoke_contract = "Logged-in macOS/Windows desktop only: observe actual tracking before cancel/replacement, preserve the new menu after stale/wrong-window close and old-owner destruction, await teardown, then open successfully in the surviving window. Unsupported and watchdog expiry fail; no Kit fallback or native selection-input claim."
native_smoke_evidence = "Platforms run34396298822 at 02468534 failed both native menu watchdogs at initial active cancellation. Main NSRunLoop scheduling on macOS and restored Windows menu-loop notifications are candidates requiring native re-execution; queued replacement cancellation is also checked before invocation."
validation = "Shared lifecycle tests run on Linux; native cancellation/replacement/teardown execution requires the dispatched macOS/Windows lanes and is not established by Linux tests."

[framework_intrinsic_layout]
contract = "Window::request_intrinsic_layout distinguishes natural content dimensions from authored aspect ratio. Assigned axes and size constraints win; only missing axes derive from the natural ratio. Block intrinsic widths, flex/grid stretch, absolute insets and unresolved percentages share one local layout result authority. Ordinary measured text retains the stock leaf algorithm; no Taffy vendor or patch and no renderer ABI change."
tests = ["image_intrinsic_measurement_matrix", "measured_leaf_stretch_is_not_forced_by_the_flex_parent", "cover_image_rounds_all_corners_in_a_clipped_media_card"]

[framework_line_breaking]
contract = "Unshaped fragments, shaped glyph runs and wrapped truncation use Unicode 15.0 UAX #14 opportunities from unicode-linebreak 0.1.5. Inline objects use U+FFFC for classification while retaining caller UTF-8 byte lengths. Continuation indentation and emergency character wrapping remain supported. No host text preprocessing or width expansion."
tests = ["unicode_wrap_keeps_punctuation_with_its_text", "unicode_wrap_crosses_fragments_and_maps_inline_element_bytes", "unicode_wrap_preserves_words_and_mixed_script_opportunities", "unicode_mandatory_breaks_and_truncation_share_wrap_boundaries", "shaped_unicode_wrap_respects_punctuation_across_runs"]

[framework_glass_profile]
contract = "A bounded elliptical height field drives Snell refraction, spectral indices and Schlick Fresnel reflection in Metal, HLSL and WGSL. Thickness and effective optical-plane depth are scaled lengths; refractive index is dimensionless. The union retains derivative magnitude and its normal flattens before rounded arc collapse. Sampling bounds derive from Snell slope, with no empirical displacement cap. Material ABI adds three scalar fields; WGPU/Direct3D uniform headers are 176 bytes. Screen-space single-interface optics, not volume tracing or Apple's private renderer."
tests = ["rounded_optical_profiles_flatten_before_the_arc_normal_collapses", "snell_sampling_bound_covers_thick_distant_and_dispersed_surfaces", "glass_snell_pixels_follow_height_index_dispersion_and_optical_plane", "glass_index_one_has_no_fresnel_even_with_a_curved_surface", "glass_corner_medial_axis_does_not_invent_a_specular_normal", "glass_menu_corner_does_not_concentrate_light_at_the_arc_centre"]
validation = "Linux WGPU pixel tests and offscreen catalog are local authority. Native Metal tests, HLSL compilation and macOS/Windows baselines require the Platforms lane; WARP uses WGPU and is not native Direct3D pixel evidence."

[framework_luminance_probe]
contract = "LuminanceProbeLease encodes a 4-bit physical slot and 28-bit generation in the existing u32 material field. Exhausted slots retire without wraparound. Metal, Direct3D and WGPU share LuminanceProbeCache: absent probes read None; completed samples must match full ID and current activation, and cannot overwrite newer samples. No GPU ABI change or new Metal wait."
tests = ["a_reacquired_slot_cannot_read_or_publish_the_previous_owners_value", "an_unsubmitted_fallback_probe_has_no_reading", "late_old_activation_callbacks_cannot_restore_or_overwrite_readings", "exhausted_generations_retire_slots_instead_of_wrapping", "a_reacquired_probe_requires_its_own_admitted_metal_submission", "a_reacquired_probe_requires_its_own_admitted_wgpu_submission"]

[framework_accessibility]
cross_tree_active_descendant = "A role-bearing overlay option may refer to one uniquely identified focused owner in the same window; GPUI projects AccessKit focus without reparenting either node."
clipped_role_bounds = "Role-bearing element bounds are intersected with the active content mask before AccessKit publication; fully clipped nodes are omitted for that frame."
resolved_element_focus = "InteractiveElement::on_focus_resolved observes the exact explicit or framework-generated handle after subtree prepaint; non-focusable elements report no handle, and Kit diagnostics use this authority without changing AccessKit focus."
shared_values = "Element::write_a11y_info_shared defers complete Value materialization until final node properties change. Static parents and identical visible TextRuns are retained; changed selection, value, bounds and reactivation publish complete values. Legacy mutable parent access and relationship naming retain full-value semantics."
value_work = "Window::accessibility_value_work reports producer materialized, retained, debug-cloned and relationship UTF-8 bytes. It excludes source flattening, child metadata, stock native consumer/adapter copies and explicit full-value queries; neither selection-only nor text-edit total work is claimed bounded. Native macOS/Windows evidence requires the on-demand platform lane."
logical_caches = "TextArea retains no-wrap row arrays by persistent document/projection identity and grapheme representability by immutable source storage. Static and selection-only frames construct zero row entries and check zero grapheme bytes. Edits invalidate both; wrap geometry changes invalidate rows. Native tree metadata remains document-wide."
wrapped_publication = "TextArea publishes current prepaint wrapped rows with current cell geometry, avoiding a transient hard-row topology on edits. Folded views preserve full-source accessibility rows. A local wrapped edit segments its changed paragraph; subsequent unchanged draws publish no text runs. Complete native Value and document-wide metadata costs remain."

[framework_layout]
measured_reveal = "A stable-id Reveal measures its subtree at an unconstrained primary extent, contributes caller progress to layout, and shares one clip across paint, hit testing, and accessibility; it owns no motion clock or easing."

[framework_motion]
spring = "SpringConfig analytically advances position and velocity for fixed or steadily moving targets; with_spring retains per-element state across retargeting, supports pause, stop, complete, and cancel, and resolves finite overshoot without clamping. Reduced motion snaps a running spring to its target."

[framework_gestures]
portable_touch = "Stable contact IDs resolve to tap, axis-locked scrolling/fling, claimed drag/long press, captured directional pan or two-contact pinch. Unclaimed pan cancels before pinch; a captured pan promotes only to its same-ID registered pinch. Extra contacts drain without phantom taps."
scroll_physics = "PlatformGestures selects exponential or Android friction-spline deceleration without replacing the source-compatible GestureTuning::momentum_decay_per_ms field."
handoff = "After live scroll consumes movement, a TouchPanEvent may acquire only its residual; touch_start_position retains the hit anchor and start_position rebases to current minus residual. Captured ownership lasts through reversal and one terminal phase. Prediction is disabled in frames with arbitration listeners."
interruption = "Inactive platform status invokes Window::cancel_touch_input before suspension, cancelling pending recognition, owned gestures and released momentum. Per-contact cancellation never cancels an unrelated owner."
limitations = ["no rotation or arbitrary simultaneous gesture graph", "captured manipulation does not hand back to scrolling on reversal", "owners must cancel before unregistering their captured listener", "shared tests do not establish native device integration"]

[framework_mobile_input]
insets = "Window::insets and invalidation callbacks expose residual edge occlusion in logical current-viewport pixels; effective is per-edge maximum, not addition. Floating keyboards are not approximated as full-width edge padding."
text = "InputHandler, EntityInputHandler and PlatformInputHandler forward keyboard/autofill hints, fallible editor actions and UTF-16 native geometry queries. Focus/options notifications follow the installed accepting handler; backend callbacks must defer reentrant queries."
limitations = ["keyboard/autofill hints are best-effort, not validation or SMS retrieval", "unknown text geometry returns unavailable rather than invented coordinates", "unsupported paragraph-direction mutations return false"]

[framework_profiling]
frame_submission = "FrameTiming retains each draw; FrameSubmissionTiming pairs the newly drawn frame with the synchronous platform submission call, first invalidating input, and coalesced top-level input count. FrameTimingMonitor remains passive and bounded but summarizes submitted frames."
meaning = "Submission completion means the PlatformWindow draw call returned, not that a compositor or display presented the frame."
excluded = ["upstream profiler journal", "hang report integration", "debug frame overlay", "compositor presentation callbacks"]

[kit_dock_tree]
ownership = "DockTopology and its stable ids remain caller-owned; DockTree projects them through SplitTree, Tabs, and the shared drag system and emits selection, collapse, resize, move, and split intents without applying them."
invariants = ["load/dump/load fixpoint", "empty stacks persist", "malformed records reject", "selection and collapse preserve unrelated ratios", "resize reports only the dragged split", "one completed drop emits one move intent", "ratios are dimensionless across container sizes"]
excluded = ["upstream retained PaneTree reducer", "panel entity registry", "DockArea reconciliation cache", "product persistence transport"]

[framework_paint]
sprite_corner_coverage = "A polychrome sprite's rounded-corner mask sizes its antialiasing ramp from the analytic gradient of its own signed distance field, mapped to device pixels through the sprite's transform, on every renderer; it consumes no screen-space derivative and so does not depend on how a backend fills a helper invocation across a triangle seam."
edge_fade = "Solid quads and filled paths crossing one active edge fade per pixel in their shader bounds; shadows, SVG masks, images, and sprite instances larger than the band sample alpha at the center of bounds intersected with the fade region, while atomic primitives no larger than the band retain nearest-edge fading."
backdrop_glass_region = "Metal, Direct3D, and WGPU snapshot and process only the integral visible backdrop-glass region plus conservative Gaussian and optical sampling reach while retaining full-viewport texture coordinates; WGPU evaluates each Gaussian weight once into a GPU texture and reuses stable bind groups."
backdrop_luminance = "A Metal luminance query returns the latest reading published by a completed command buffer and never waits for the GPU; a slow completion may therefore leave the previous completed frame's reading visible for another frame."

[framework_editable_document]
contract = "EditBuffer uses persistent Ropey storage with LF line indexing; EditSnapshot indexed slices and UTF-16 conversion avoid whole-document materialization. Legacy text() intentionally materializes once per revision. Grapheme clamping traverses borrowed rope chunks; exact history byte deltas are never re-clamped. No-wrap EditableTextLayout shapes visible lines and exact on-demand geometry through WindowTextSystem; selection painting is bounded independently of logical range queries."
soft_wrap = "EditableWrappedCache retains exact paragraph shapes and row indices across static/scroll/selection frames, reshaping changed source/style paragraphs. TextArea applies exact viewport rows after caret reveal. Initial layout and font/width reflow shape all paragraphs; source changes rebuild hard-line metadata. The same shapes govern paint, hit tests, IME and native visual rows."
tests = ["indexed_lines_survive_asymmetric_edits_and_persistent_snapshots", "large_file_edits_do_not_materialize_document_and_lines_stay_indexed", "indexed_unicode_offsets_match_platform_rounding", "chunk_crossing_graphemes_match_contiguous_clamping", "undo_replays_exact_bytes_when_insertion_joined_a_grapheme"]
limitations = ["contiguous compatibility callers still copy the whole document", "unbounded Unicode grapheme context may require traversing many chunks without copying them", "cold soft-wrap layout and font/width reflow still shape the full document", "a giant hard paragraph remains one shaping input and its paint path may traverse offscreen glyphs", "new revisions rebuild wrap/visual/native metadata; unchanged row arrays are retained", "no-wrap width reports measured lines rather than unseen lines", "native macOS and Windows evidence requires the on-demand platform lane"]

[release_validation]
dependency_graph = "cargo run -p xtask -- dependencies check"
publication_plan = "cargo run -p xtask -- package plan"
registry_only = "cargo run -p xtask -- package check"
requires_recorded_platform_evidence = true

[framework_virtual_scroll]
contract = "ListState::remap_items and ListOffset::remap retain row geometry and identity anchors at absolute pixel offsets for measured and keyed uniform lists. Removal selects the nearest surviving old-order successor, then predecessor. Width changes invalidate geometry. Window::consume_scroll_delta subtracts actual clamped source-axis motion; subsequent listeners receive unused axes and partial-edge remainder in native pixel/line units. ListScrollEvent reports actual signed motion, not layout growth. Targeted remeasurement refreshes only its window."
tests = ["reordered_rows_preserve_identity_anchor", "removed_anchor_uses_old_order_successor_then_predecessor", "remap_retains_measurements_focus_and_rebases_pending_geometry", "nested_wheel_moves_only_consumer_and_chains_at_edge", "revisions_remeasure_offscreen_rows_without_reidentifying_them", "history_and_reorder_are_not_new_tail_messages"]
platform_validation = "Shared platform-independent tests run on Linux; dispatch Platforms after integration for native macOS/Windows input tests and Metal/WARP scene catalogs. No platform renderer or native event translation changes."
limitations = ["count-only surfaces cannot infer insertion or reorder identity; use unique keys", "offscreen asynchronous geometry changes require explicit revision or remeasure_rows notification"]

[kit_editor_syntax]
contract = "Optional syntax feature: Tree-sitter 0.25.10 with bundled JSON 0.24.8; borrowed EditSnapshot byte chunks, exact revisioned UTF-8 InputEdit transitions, viewport highlight queries, caller highlight precedence. No LSP transport, grammar download, process, or workspace ownership."
tests = ["incremental_json_edits_use_utf8_points_and_match_a_fresh_parse", "a_large_json_edit_reuses_the_tree_and_queries_only_the_requested_region", "grammar_errors_and_invalid_queries_are_reported", "syntax_tracks_real_area_edits_and_reports_parse_errors"]
limitations = ["synchronous parsing", "parser internal work is not measured by borrowed input counters", "only JSON grammar bundled", "native macOS and Windows parser evidence awaits platform lane"]

[framework_x11_platform_view]
contract = "Linux X11 (including XWayland) hosts caller-owned native child XIDs in rectangular clip windows; full viewport allocation, physical-pixel resize, native input crop, paint-order stacking and detach/lifetime restoration are supported. Native Wayland, GPU transforms, rounded masks and X11 GPUI scene overlays above native children are not supported."
commands = ["xvfb-run -a cargo test -p gpui-box-linux x11_native_children -- --ignored", "cargo test -p gpui-box platform_view --features test-support"]

[renderer_timing]
contract = "Opt-in headless measurement separates CPU encoding/submission, CPU-observed completion, GPU execution-clock evidence, and query readback. FrameTimingMonitor input-to-submission remains a CPU boundary. Normal rendering does not wait."
backends = ["wgpu Linux software Vulkan", "wgpu Windows WARP", "native Metal command-buffer timestamps"]
excluded = ["native Windows Direct3D renderer timing", "compositor and display presentation latency", "cross-host comparisons", "pixel readback as GPU execution", "complete application or component performance coverage"]
validation = "Run renderer_timing_is_owned_by_each_successful_submission on the native backend and the renderer-timing harness on each native host; Linux results do not prove Metal or WARP."

[framework_effect_owner]
contract = "EffectOwner is an opaque host token inherited through all subtree element phases, measured layout, registered mouse/key/action/accessibility/focus callbacks, deferred draws, tooltip timers/window overlays, prompts, drag previews and installed IME handlers. Cached callbacks retain their owner; owner changes invalidate view reuse. Host clipboard policy denies missing owners and never grants implicit gesture exceptions. Legacy APIs enforce the policy; try APIs distinguish refusal from empty clipboard."
tests = ["clipboard_policy_denies_missing_stale_and_legacy_effects", "owner_scopes_restore_on_unwind_and_deferred_work_requires_explicit_retention", "cached_and_deferred_callbacks_retain_nested_owner_and_reparent_safely", "installed_ime_owner_is_not_taken_from_later_focus_or_dispatch", "asynchronous_continuations_require_explicit_owner_reentry", "tooltip_timer_and_window_overlay_preserve_owner"]
limitations = ["host must map tokens to grants and revoke stale generations", "async and deferred notification work must explicitly retain/re-enter an owner; it never borrows later focus", "without installed host policy plain native apps retain existing clipboard behavior", "write success means authorized platform submission, not readback verification or a display acknowledgement"]
platform_validation = "Shared callback, cache and IME dispatch tests run on Linux. macOS and Windows native validation requires the on-demand Platforms lane after integration; macOS find pasteboard is cfg-gated. No native event translator or renderer ABI changes."

[framework_typed_scopes_and_scroll_axes]
contract = "EffectScoped<T> retains the child's EffectOwner through typed map operations until element rendering. From<T> inherits ambient ownership. Vertical Div/UniformList no longer project pure horizontal wheel input into row scrolling; diagonal residuals preserve independent axes."
tests = ["unscoped_typed_children_inherit_but_owned_siblings_keep_their_scope", "cached_and_deferred_callbacks_retain_nested_owner_and_reparent_safely", "horizontal_wheel_bypasses_tall_uniform_list"]
platform_validation = "Shared native input/owner tests and Linux full gate; macOS and Windows require the parent's integrated Platforms lane. No native translator or renderer changes."

[kit_owner_keyed_state]
contract = "All typed keyed registries partition by exact EffectOwner, window and key. Hosts explicitly register_owner_state on minting a mount; ambient scopes never register. release_owner_state drops only that owner's registry entries synchronously and removes registration. Unknown/retired tokens cannot recache. Unowned native state retains prior behavior."
tests = ["owner_churn_retains_no_history_or_peak_table_with_a_live_peer", "owner_release_drops_every_typed_composite_key_without_touching_siblings", "a_late_explicit_owner_continuation_cannot_repopulate_released_state", "owner_is_retained_when_wheel_follow_updates_are_deferred", "owner_retirement_stops_a_glide_before_its_final_jump"]
limitations = ["host must register freshly minted true mount tokens and preserve typed child scopes; never register from rerender or callbacks", "worker principals/grants are separate host policy", "release drops registry references, not arbitrary externally retained Rc/Entity handles", "active and owner-group tables shrink geometrically after removals; per-type release registry remains bounded by state types, and window shells live until window close", "window-wide modal coordination, weak toast routing and effect budgeting are not keyed mount caches"]

[framework_win32_toolkit_allocation]
contract = "After native HWND placement, an opt-in UI-thread callback allocates toolkit content using the full physical viewport, not the clip region. WebView2 controller bounds use this callback; GPUI retains HWND positioning and clipping authority."
commands = ["cargo test -p gpui-box allocation_callback --features test-support", "cargo run --locked -p gpui-box-webview --example smoke"]
limitations = ["Windows native execution required; cross-compilation and Linux smoke do not certify WebView2 allocation", "does not add arbitrary transforms or rounded clipping"]

[framework_native_editable_geometry]
contract = "Native selection fragments follow retained shaped glyph cells and exact soft-wrap rows, preserving logical endpoint flags and Unicode resolved direction. NativeTextPosition preserves both incident bidi/soft-wrap carets; NativeTextSelection atomically retains primary anchor/head affinities in EditBuffer and history. Legacy logical selection setters explicitly reset downstream. Undo, redo and active IME cancellation restore both primary affinities."
commands = ["cargo test -p gpui-box --lib editable_text --no-default-features", "cargo run -p xtask -- dependencies check", "cargo run -p xtask -- gate full"]
limitations = ["Linux geometry tests do not certify UIKit or Android native execution", "legacy usize geometry is an explicitly lossy projection of the affinity-aware methods", "the current editable layout paints uniform-height horizontal rows", "font-provided intra-ligature caret positions are absent from ShapedGlyph; interior caret queries and movement requiring them return None, and selections cover the actual full cluster", "paragraph-direction mutation is unsupported because the editable model has no direction overrides", "point, range and movement queries enumerate the document; caret bounds instead resolve only the incident hard paragraph, with indexed UTF16 conversion for source layouts", "secondary cursors retain the existing logical-only policy; an atomic native selection replaces the primary and clears secondaries", "secret fields retain only active composition rollback state, never completed undo/redo history"]
