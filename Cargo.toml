[workspace]
resolver = "3"
members = [
  "crates/gpui-kit-assets",
  "crates/gpui-kit-semantics",
  "crates/gpui-kit-testkit",
  "crates/gpui-kit-theme",
  "crates/gpui-kit-tokens",
  "crates/gpui-kit",
  "examples/gallery",
  "tools/mcp",
  "xtask",
]
# Its own workspace on purpose: the Linux/Windows visual harness has
# platform-specific renderer dependencies and keeps an independent lockfile.
# Both workspaces still pin the exact same Zed integration revision.
exclude = ["tools/headless-visual"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/fran0220/gpui-kit"
rust-version = "1.97"

[workspace.dependencies]
unicode-segmentation = "1"
unicode-bidi = "0.3"
anyhow = "1"
gpui = { git = "https://github.com/fran0220/zed", rev = "a754da44757a0aa5179224fe37a024c7517c7a92" }
# Matches the instant type GPUI's executor clock returns, so tests can drive
# motion through the simulated clock instead of wall time.
web-time = "1"
gpui_platform = { git = "https://github.com/fran0220/zed", rev = "a754da44757a0aa5179224fe37a024c7517c7a92", features = ["font-kit"] }
png = "=0.18.1"
# Parsing only. The html feature is off: this crate renders Markdown to GPUI
# elements and never produces or executes HTML.
pulldown-cmark = { version = "0.13", default-features = false }
raw-window-handle = "=0.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
toml = "0.8"

core-graphics = "=0.24.0"
objc2-app-kit = { version = "=0.3.2", features = ["NSView", "NSWindow"] }

gpui-kit-assets = { path = "crates/gpui-kit-assets" }
gpui-kit-semantics = { path = "crates/gpui-kit-semantics" }
gpui-kit-testkit = { path = "crates/gpui-kit-testkit" }
gpui-kit-theme = { path = "crates/gpui-kit-theme" }
gpui-kit-tokens = { path = "crates/gpui-kit-tokens" }
gpui-kit = { path = "crates/gpui-kit" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Scene captures encode 160 full-window PNGs per run, and the deflate inside
# is what a debug build spends most of its time on. Optimizing just the
# compression crates keeps `scenes capture` fast without giving up debug
# builds for anything of ours.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
