server {
    listen 80;
    listen [::]:80;
    server_name gpui-box.origingame.dev gpui-kit.origingame.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gpui-box.origingame.dev gpui-kit.origingame.dev;

    ssl_certificate     /etc/nginx/ssl/origingame.crt;
    ssl_certificate_key /etc/nginx/ssl/origingame.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($ssl_server_name !~ ^(gpui-box|gpui-kit)\.origingame\.dev$) { return 444; }

    root /opt/gpui-box/current/public;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        proxy_pass http://127.0.0.1:9350/healthz;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:9350/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Browsers get the human documentation page at the slash path. MCP clients
    # that retain a trailing slash still reach the same stateless POST handler.
    location = /mcp/ {
        error_page 418 = @mcp_post;
        if ($request_method = POST) { return 418; }
        try_files /mcp/index.html =404;
    }

    location @mcp_post {
        proxy_pass http://127.0.0.1:9350;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(?:api-index|developer-index|build-info)\.json$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
