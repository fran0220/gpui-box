# The headless visual gate: the scene catalog rendered and compared without a
# window system, which is what lets Linux and Windows machines hold a visual
# baseline at all. macOS keeps its native gate in `xtask scenes`.
#
# This package is deliberately its own workspace because its Linux/Windows
# renderer dependencies and lockfile are platform-specific. Its Zed source and
# revision must still match the root workspace exactly; `xtask dependencies
# check` enforces that contract.

[package]
name = "headless-visual"
publish = false
edition = "2024"
version = "0.1.0"
license = "MIT"

[dependencies]
anyhow = "1"
# The same major version GPUI's `render_to_image` returns, so the image value
# crosses the crate boundary as one type.
image = "0.25"
gpui = { git = "https://github.com/fran0220/zed", rev = "b9e434908126d3215c22443b0102093113f8b292", features = ["test-support"] }
gpui-kit = { path = "../../crates/gpui-kit", features = ["fixtures"] }
gpui-kit-semantics = { path = "../../crates/gpui-kit-semantics" }
gpui-kit-theme = { path = "../../crates/gpui-kit-theme" }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
gpui_platform = { git = "https://github.com/fran0220/zed", rev = "b9e434908126d3215c22443b0102093113f8b292", features = ["test-support"] }
gpui_wgpu = { git = "https://github.com/fran0220/zed", rev = "b9e434908126d3215c22443b0102093113f8b292", features = ["test-support"] }

[workspace]
