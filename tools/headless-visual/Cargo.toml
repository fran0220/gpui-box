# The headless visual gate: the scene catalog rendered and compared without a
# window system on supported macOS and Windows hosts.
#
# macOS renders through the Metal headless renderer and Windows through WARP.
# The Linux path remains buildable for a future roadmap wave, but its retained
# llvmpipe baselines are not a current compatibility or release gate.
#
# This package is deliberately its own workspace because its renderer
# dependencies and lockfile are platform-specific. Its Zed source and revision
# must still match the root workspace exactly; `xtask dependencies check`
# enforces that contract.

[package]
name = "headless-visual"
publish = false
edition = "2024"
version = "0.1.0"
license = "MIT"

[dependencies]
anyhow = "1"
# The same major version GPUI's `render_to_image` returns, so the image value
# crosses the crate boundary as one type.
image = "0.25"
gpui = { git = "https://github.com/fran0220/zed", rev = "0b9c8dc932b65cba2dc87464148984e93f60ae18", features = ["test-support"] }
gpui-kit = { path = "../../crates/gpui-kit", features = ["fixtures"] }
gpui-kit-semantics = { path = "../../crates/gpui-kit-semantics" }
gpui-kit-theme = { path = "../../crates/gpui-kit-theme" }

# `gpui_platform` supplies the headless renderer each platform actually ships:
# Metal on macOS, wgpu elsewhere. `gpui_wgpu` additionally supplies the
# bundled-font text system, which every platform uses so that shaping cannot
# vary with the machine's installed fonts.
gpui_platform = { git = "https://github.com/fran0220/zed", rev = "0b9c8dc932b65cba2dc87464148984e93f60ae18", features = ["test-support"] }
gpui_wgpu = { git = "https://github.com/fran0220/zed", rev = "0b9c8dc932b65cba2dc87464148984e93f60ae18", features = ["test-support"] }

[workspace]
