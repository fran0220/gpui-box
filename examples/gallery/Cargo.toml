[package]
name = "gpui-kit-gallery"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
gpui.workspace = true
# `test-support` unlocks `Window::render_to_image`, which is what scene
# captures read. The gallery is a dev-only binary, so the test harness this
# pulls into GPUI never reaches a shipping build.
gpui_platform = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["fixtures"] }
gpui-kit-assets.workspace = true
gpui-kit-semantics.workspace = true
gpui-kit-testkit = { workspace = true, features = ["test-support"] }
gpui-kit-theme.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
